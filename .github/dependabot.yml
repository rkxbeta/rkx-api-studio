# Keeps the SHA-pinned GitHub Actions current. npm dependencies are not bumped
# automatically: the committed build/ must reproduce byte-for-byte from the lockfile,
# so dependency updates are made deliberately in a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
